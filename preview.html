<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile README Preview - caviraj</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    .header-bar {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px 8px 0 0;
      padding: 12px 20px;
      font-weight: 600;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .markdown-body {
      box-sizing: border-box;
      padding: 35px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <span>🐙 github.com/caviraj / README.md Preview</span>
    </div>
    <article id="content" class="markdown-body">
      Loading preview...
    </article>
  </div>

  <script>
    fetch('README.md')
      .then(response => response.text())
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p style="color:red;">Error loading README.md</p>';
      });
  </script>
</body>
</html>
